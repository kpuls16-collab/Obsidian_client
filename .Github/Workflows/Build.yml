
name: Build Fabric Utility Client

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build project
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: fabric-utility-client
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fabric-utility-client-source
          path: |
            **/*.java
            build.gradle
            gradle.properties
            settings.gradle
            src/main/resources/**
          if-no-files-found: warn
          
